# pnpm 12 blocks dependency install scripts by default; only these are allowed explicitly.
allowBuilds:
  esbuild: true
  sharp: true

# Our own packages (ui-library, tokens) are used right after we publish them; the release-age delay
# only protects against compromised third-party releases.
minimumReleaseAgeExclude:
  - '@inzumer/*'

# Also install the WebAssembly builds of native packages, used automatically when a native binary
# can't load (e.g. Windows Smart App Control blocking a freshly released `.node` file).
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - wasm32

# Patched versions of vulnerable transitive dependencies (pnpm audit).
overrides:
  'katex@>=0.11.0 <0.18.2': '^0.18.2'
  'postcss-selector-parser@<7.1.6': '^7.1.6'
  'source-map-js@<1.2.2': '^1.2.2'
